[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cirquit"
version = "0.1.0"
description = "Readable, editable SVG schematics for electrical and circuit-QED circuits"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Andrea Maiani" }]
dependencies = ["lxml>=4.9"]

[project.optional-dependencies]
tex = ["vectex>=0.1"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
