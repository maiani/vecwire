[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vecwire"
version = "0.3.0"
description = "Readable, editable SVG schematics for electrical and circuit-QED circuits"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Andrea Maiani", email = "dev@andreamaiani.com" }]
license = "MIT"
keywords = ["svg", "circuit", "schematic", "circuit-qed", "vector-graphics", "figures"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]
dependencies = ["lxml>=4.9"]

[project.urls]
Source = "https://github.com/maiani/vecwire"
Issues = "https://github.com/maiani/vecwire/issues"

[project.optional-dependencies]
tex = ["vectex>=0.1"]
dev = ["lxml-stubs>=0.5", "ty>=0.0.84", "pytest>=8", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/vecwire"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/AGENTS.md",
  "/docs/development.md",
  "/pyproject.toml",
]
exclude = ["/examples/output"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Keep library signatures annotated; ty checks their types.
extend-select = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206"]
select = ["B", "E", "F", "I", "N", "RUF", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
# S314: tests parse SVG this package just generated, not untrusted input.
"tests/**" = ["ANN", "S101", "S314"]
"examples/**" = ["ANN", "S101"]

[tool.ty.src]
include = ["src"]
